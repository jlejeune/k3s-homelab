---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-agent-pvc
  namespace: home-automation
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-config
  namespace: home-automation
data:
  config.yaml: |
    model:
      provider: custom
      default: qwen2.5:3b
      base_url: http://192.168.1.205:11434/v1
      api_key: "none"
      context_length: 65536

    auxiliary:
      compression:
        context_length: 65536

    agent:
      max_turns: 5

    discord:
      require_mention: true
      auto_thread: true

    terminal:
      backend: local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: home-automation
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/instance: hermes-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: hermes-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: hermes-agent
    spec:
      initContainers:
        - name: agent-src-init
          image: nousresearch/hermes-agent:v2026.5.16
          command: ["sh", "-c", "cp -a /opt/hermes/. /agent-src/"]
          volumeMounts:
            - name: agent-src
              mountPath: /agent-src
      containers:
        - name: hermes-agent
          image: nousresearch/hermes-agent:v2026.5.16
          args: ["gateway", "run"]
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: config
              mountPath: /opt/data/config.yaml
              subPath: config.yaml
            - name: env-secret
              mountPath: /opt/data/.env
              subPath: .env
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            exec:
              command: ["pgrep", "-f", "gateway"]
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
        - name: hermes-webui
          image: ghcr.io/nesquena/hermes-webui:0.51.153
          env:
            - name: HERMES_WEBUI_HOST
              value: "0.0.0.0"
            - name: HERMES_WEBUI_PORT
              value: "8787"
            - name: HERMES_WEBUI_STATE_DIR
              value: "/opt/data/webui"
            - name: HERMES_HOME
              value: "/opt/data"
            - name: WANTED_UID
              value: "10000"
            - name: WANTED_GID
              value: "10000"
            - name: HERMES_WEBUI_AGENT_DIR
              value: "/opt/hermes"
          ports:
            - containerPort: 8787
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: agent-src
              mountPath: /opt/hermes
              readOnly: true
            - name: config
              mountPath: /opt/data/config.yaml
              subPath: config.yaml
            - name: env-secret
              mountPath: /opt/data/.env
              subPath: .env
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 8787
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-agent-pvc
        - name: config
          configMap:
            name: hermes-agent-config
        - name: env-secret
          secret:
            secretName: hermes-agent-secret
        - name: agent-src
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-webui
  namespace: home-automation
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: hermes-agent
  ports:
    - port: 80
      targetPort: 8787
