---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-ruben
  namespace: home-automation
  labels:
    grafana_dashboard: "1"
data:
  ruben.json: |
    {
      "title": "Poêle Ruben",
      "uid": "ruben-pellet-stove",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-24h", "to": "now" },
      "panels": [
        {
          "type": "stat",
          "title": "État",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            {
              "expr": "ha_climate_action{entity=\"climate.ruben\"} == 1",
              "legendFormat": "{{ '{{action}}' }}",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "name",
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "heating": { "color": "orange", "index": 0 } } },
                { "type": "value", "options": { "idle": { "color": "green", "index": 1 } } },
                { "type": "value", "options": { "off": { "color": "dark-gray", "index": 2 } } }
              ]
            }
          }
        },
        {
          "type": "stat",
          "title": "Consigne",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            { "expr": "ha_climate_target_temperature_celsius{entity=\"climate.ruben\"}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "celsius", "decimals": 1 } }
        },
        {
          "type": "stat",
          "title": "Température ambiante",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            { "expr": "ha_climate_current_temperature_celsius{entity=\"climate.ruben\"}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "celsius", "decimals": 1 } }
        },
        {
          "type": "stat",
          "title": "Pellets consommés (24 h)",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            { "expr": "increase(ha_sensor_weight_kg{entity=\"sensor.ruben_quantite_de_granules\"}[24h])", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "kg", "decimals": 1 } }
        },
        {
          "type": "stat",
          "title": "Puissance de combustion",
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            { "expr": "ha_number_state{entity=\"number.ruben_puissance_de_combustion\"}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "max": 5, "min": 0 } }
        },
        {
          "type": "stat",
          "title": "Disponibilité",
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            { "expr": "ha_entity_available{entity=\"climate.ruben\"}", "refId": "A" }
          ],
          "options": { "textMode": "value", "colorMode": "background" },
          "fieldConfig": { "defaults": { "mappings": [
            { "type": "value", "options": { "1": { "text": "OK", "color": "green" } } },
            { "type": "value", "options": { "0": { "text": "KO", "color": "red" } } }
          ] } }
        },
        {
          "type": "gauge",
          "title": "Pellets restants (estimation, kg)",
          "description": "Capacité utile du réservoir (13 kg) moins la consommation depuis le dernier plein. Le compteur valait 38 kg au plein du 2026-10-21 : à mettre à jour à chaque remplissage.",
          "gridPos": { "h": 5, "w": 8, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            { "expr": "clamp_min(13 - (ha_sensor_weight_kg{entity=\"sensor.ruben_quantite_de_granules\"} - 38), 0)", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "kg", "decimals": 1, "min": 0, "max": 13, "thresholds": { "mode": "absolute", "steps": [
            { "color": "red", "value": null },
            { "color": "orange", "value": 3 },
            { "color": "green", "value": 6 }
          ] } } }
        },
        {
          "type": "stat",
          "title": "Autonomie estimée (h de chauffe)",
          "description": "Pellets restants divisés par le rythme moyen de consommation sur 7 jours. Estimation grossière : le compteur est en kg entiers.",
          "gridPos": { "h": 5, "w": 8, "x": 8, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            { "expr": "clamp_min(13 - (ha_sensor_weight_kg{entity=\"sensor.ruben_quantite_de_granules\"} - 38), 0) / on() ((max_over_time(ha_sensor_weight_kg{entity=\"sensor.ruben_quantite_de_granules\"}[7d]) - min_over_time(ha_sensor_weight_kg{entity=\"sensor.ruben_quantite_de_granules\"}[7d])) / on() (count_over_time((ha_climate_action{entity=\"climate.ruben\",action=\"heating\"} == 1)[7d:1m]) / 60))", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "h", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [
            { "color": "red", "value": null },
            { "color": "orange", "value": 4 },
            { "color": "green", "value": 8 }
          ] } } }
        },
        {
          "type": "stat",
          "title": "Rythme de consommation (kg/h de chauffe, 7 j)",
          "gridPos": { "h": 5, "w": 8, "x": 16, "y": 4 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            { "expr": "(max_over_time(ha_sensor_weight_kg{entity=\"sensor.ruben_quantite_de_granules\"}[7d]) - min_over_time(ha_sensor_weight_kg{entity=\"sensor.ruben_quantite_de_granules\"}[7d])) / on() (count_over_time((ha_climate_action{entity=\"climate.ruben\",action=\"heating\"} == 1)[7d:1m]) / 60)", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "suffix: kg/h", "decimals": 2 } }
        },
        {
          "type": "timeseries",
          "title": "Températures",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 9 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            { "expr": "ha_climate_current_temperature_celsius{entity=\"climate.ruben\"}", "legendFormat": "Ambiante", "refId": "A" },
            { "expr": "ha_climate_target_temperature_celsius{entity=\"climate.ruben\"}", "legendFormat": "Consigne", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "celsius" } }
        },
        {
          "type": "timeseries",
          "title": "Température de combustion du bois",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 9 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            { "expr": "ha_sensor_temperature_celsius{entity=\"sensor.ruben_temperature_de_combustion_du_bois\"}", "legendFormat": "Combustion", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "celsius" } }
        },
        {
          "type": "state-timeline",
          "title": "Historique état",
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 17 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            { "expr": "ha_climate_action{entity=\"climate.ruben\"} == 1", "legendFormat": "{{ '{{action}}' }}", "refId": "A" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Pellets consommés, cumul du compteur (kg, 7 j)",
          "timeFrom": "7d",
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 23 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            { "expr": "ha_sensor_weight_kg{entity=\"sensor.ruben_quantite_de_granules\"}", "legendFormat": "Cumul", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "kg" } }
        },
        {
          "type": "timeseries",
          "title": "Consommation de pellets par jour (kg, 6 j)",
          "description": "Chaque barre = consommation d'une journée locale, journée en cours comprise (l'horodatage de la barre est à 2 h du matin). La fenêtre est de 6 jours car VictoriaMetrics ne garde que 7 jours : une barre plus ancienne afficherait un faux 0. Le décalage de la requête (offset -22h) vaut pour l'heure d'été ; à l'heure d'hiver (UTC+1), passer à -23h.",
          "timeFrom": "6d",
          "interval": "1d",
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 23 },
          "datasource": { "type": "prometheus", "uid": "Prometheus" },
          "targets": [
            { "expr": "increase(ha_sensor_weight_kg{entity=\"sensor.ruben_quantite_de_granules\"}[1d] offset -22h)", "interval": "1d", "legendFormat": "Par jour", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "kg", "decimals": 0, "min": 0, "custom": { "drawStyle": "bars", "fillOpacity": 70, "lineWidth": 1, "barAlignment": -1 } } }
        }
      ]
    }
