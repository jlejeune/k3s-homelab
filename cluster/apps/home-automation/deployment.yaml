---
vars:
  - targetPath: LB_MQTT_ADDRESS
    clusterConfigMap:
      name: cluster-settings
      namespace: default
      key: LB_MQTT_ADDRESS
  - targetPath: LB_MUSIC_ASSISTANT_ADDRESS
    clusterConfigMap:
      name: cluster-settings
      namespace: default
      key: LB_MUSIC_ASSISTANT_ADDRESS

deployments:
  - include: piper
  - include: whisper
  - path: code-server
  - include: go2rtc
  - path: home-assistant
  - path: mosquitto
  - include: zigbee2mqtt
  - include: openwakeword
  - path: esphome
  - path: music-assistant
