---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: dawarich-data-pv
spec:
  storageClassName: nfs
  persistentVolumeReclaimPolicy: Retain
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  nfs:
    path: /volume1/k3s/nfs_volumes/dawarich/data
    server: {{NAS_ADDRESS}}
  claimRef:
    name: dawarich-data-pvc
    namespace: dawarich
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dawarich-data-pvc
  namespace: dawarich
  labels:
    app.kubernetes.io/instance: dawarich
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: nfs
