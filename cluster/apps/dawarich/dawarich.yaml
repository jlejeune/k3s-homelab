---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dawarich
  namespace: dawarich
  annotations:
    reloader.stakater.com/match: "true"
data:
  RAILS_ENV: production
  SELF_HOSTED: "true"
  STORE_GEODATA: "true"
  RAILS_LOG_TO_STDOUT: "true"
  PROMETHEUS_EXPORTER_ENABLED: "false"
  APPLICATION_PROTOCOL: https
  APPLICATION_HOSTS: "dawarich.{{SECRET_DOMAIN}},dawarich.dawarich.svc.cluster.local"
  TIME_ZONE: "{{TZ}}"
  REDIS_URL: "redis://dawarich-redis:6379"
  DATABASE_HOST: dawarich-db
  DATABASE_PORT: "5432"
  DATABASE_NAME: dawarich
  DATABASE_USERNAME: dawarich
  OIDC_CLIENT_ID: dawarich
  OIDC_ISSUER: "https://auth.{{SECRET_DOMAIN}}"
  OIDC_REDIRECT_URI: "https://dawarich.{{SECRET_DOMAIN}}/users/auth/openid_connect/callback"
  OIDC_PROVIDER_NAME: Authelia
---
apiVersion: v1
kind: Service
metadata:
  name: dawarich
  namespace: dawarich
spec:
  ports:
    - name: http
      port: 3000
      targetPort: http
  selector:
    app.kubernetes.io/instance: dawarich
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dawarich
  namespace: dawarich
  labels:
    app.kubernetes.io/instance: dawarich
  annotations:
    reloader.stakater.com/search: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: dawarich
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: dawarich
    spec:
      restartPolicy: Always
      initContainers:
        - name: dawarich-storage-init
          image: busybox
          command:
            - sh
            - -c
            - mkdir -p /storage/public /storage/watched /storage/storage
          volumeMounts:
            - mountPath: /storage
              name: dawarich-data
      containers:
        - name: dawarich
          image: freikin/dawarich:1.11.0
          imagePullPolicy: IfNotPresent
          command:
            - web-entrypoint.sh
          args:
            - bin/rails
            - server
            - -p
            - "3000"
            - -b
            - "::"
          env:
            - name: WEB_CONCURRENCY
              value: "0"
          envFrom:
            - configMapRef:
                name: dawarich
                optional: false
            - secretRef:
                name: dawarich
                optional: false
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            initialDelaySeconds: 40
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - mountPath: /var/app/public
              name: dawarich-data
              subPath: public
            - mountPath: /var/app/tmp/imports/watched
              name: dawarich-data
              subPath: watched
            - mountPath: /var/app/storage
              name: dawarich-data
              subPath: storage
      volumes:
        - name: dawarich-data
          persistentVolumeClaim:
            claimName: dawarich-data-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dawarich-sidekiq
  namespace: dawarich
  labels:
    app.kubernetes.io/instance: dawarich-sidekiq
  annotations:
    reloader.stakater.com/search: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: dawarich-sidekiq
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: dawarich-sidekiq
    spec:
      restartPolicy: Always
      initContainers:
        - name: dawarich-storage-init
          image: busybox
          command:
            - sh
            - -c
            - mkdir -p /storage/public /storage/watched /storage/storage
          volumeMounts:
            - mountPath: /storage
              name: dawarich-data
      containers:
        - name: dawarich-sidekiq
          image: freikin/dawarich:1.11.0
          imagePullPolicy: IfNotPresent
          command:
            - sidekiq-entrypoint.sh
          args:
            - sidekiq
          env:
            - name: BACKGROUND_PROCESSING_CONCURRENCY
              value: "3"
          envFrom:
            - configMapRef:
                name: dawarich
                optional: false
            - secretRef:
                name: dawarich
                optional: false
          readinessProbe:
            exec:
              command:
                - pgrep
                - -f
                - sidekiq
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - pgrep
                - -f
                - sidekiq
            initialDelaySeconds: 40
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - mountPath: /var/app/public
              name: dawarich-data
              subPath: public
            - mountPath: /var/app/tmp/imports/watched
              name: dawarich-data
              subPath: watched
            - mountPath: /var/app/storage
              name: dawarich-data
              subPath: storage
      volumes:
        - name: dawarich-data
          persistentVolumeClaim:
            claimName: dawarich-data-pvc
