---
apiVersion: v1
kind: Service
metadata:
  name: yamtrack-redis
  namespace: yamtrack
spec:
  ports:
    - name: yamtrack-redis
      port: 6379
      protocol: TCP
  selector:
    app.kubernetes.io/instance: yamtrack-redis
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: yamtrack-redis-config
  namespace: yamtrack
  annotations:
    reloader.stakater.com/match: "true"
data:
  redis-config: |
    maxmemory 500mb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yamtrack-redis
  namespace: yamtrack
  labels:
    app.kubernetes.io/instance: yamtrack-redis
  annotations:
    reloader.stakater.com/search: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: yamtrack-redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: yamtrack-redis
    spec:
      restartPolicy: Always
      containers:
        - name: yamtrack-redis
          image: redis:8-alpine
          command:
            - redis-server
            - "/redis-master/redis.conf"
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - mountPath: /redis-master-data
              name: data
            - mountPath: /redis-master
              name: config
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: yamtrack-redis-config
            items:
              - key: redis-config
                path: redis.conf
