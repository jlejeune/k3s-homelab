---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apprise
  namespace: apprise
  labels:
    app.kubernetes.io/instance: apprise
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: apprise
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: apprise
    spec:
      containers:
        - name: apprise
          image: docker.io/caronc/apprise:2.0.1
          ports:
            - containerPort: 8000
              name: http
          env:
            # Stateless only: callers send their own destination URLs with each
            # request, nothing is stored on the server.
            - name: APPRISE_STATEFUL_MODE
              value: disabled
            - name: APPRISE_ATTACH_SIZE
              value: "0"
            - name: APPRISE_ADMIN
              value: "no"
            - name: APPRISE_WORKER_COUNT
              value: "1"
            - name: TZ
              value: {{TZ}}
          readinessProbe:
            httpGet:
              path: /status
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /status
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: apprise
  namespace: apprise
spec:
  ports:
    - port: 8000
      name: http
  selector:
    app.kubernetes.io/instance: apprise
