---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preflight-responder
  namespace: networking
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: preflight-responder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: preflight-responder
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.12.0
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: preflight-responder
  namespace: networking
spec:
  selector:
    app.kubernetes.io/name: preflight-responder
  ports:
    - port: 80
      targetPort: 80
