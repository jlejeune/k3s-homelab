---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-web-automated-config-pvc
  namespace: media-automation
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre-web-automated
  namespace: media-automation
  labels:
    app.kubernetes.io/instance: calibre-web-automated
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: calibre-web-automated
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: calibre-web-automated
    spec:
      containers:
        - name: calibre-web-automated
          image: ghcr.io/crocodilestick/calibre-web-automated:v4.0.6
          ports:
            - containerPort: 8083
              name: http
          env:
            - name: PUID
              value: "1026"
            - name: PGID
              value: "100"
            - name: TZ
              value: {{TZ}}
          readinessProbe:
            httpGet:
              path: /login
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /login
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: calibre-library
              mountPath: /calibre-library
            - name: cwa-book-ingest
              mountPath: /cwa-book-ingest
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: calibre-web-automated-config-pvc
        - name: calibre-library
          nfs:
            server: {{NAS_ADDRESS}}
            path: /volume1/book/library
        - name: cwa-book-ingest
          nfs:
            server: {{NAS_ADDRESS}}
            path: /volume1/book/ingest
---
apiVersion: v1
kind: Service
metadata:
  name: calibre-web-automated
  namespace: media-automation
spec:
  ports:
    - port: 8083
      name: http
  selector:
    app.kubernetes.io/instance: calibre-web-automated
