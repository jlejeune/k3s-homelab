---
vars:
  - targetPath: TZ
    clusterConfigMap:
      name: cluster-settings
      namespace: default
      key: TZ
  - targetPath: LB_TRAEFIK_ADDRESS
    clusterConfigMap:
      name: cluster-settings
      namespace: default
      key: LB_TRAEFIK_ADDRESS
  - targetPath: NAS_ADDRESS
    clusterConfigMap:
      name: cluster-settings
      namespace: default
      key: NAS_ADDRESS
  - targetPath: SECRET_DOMAIN
    clusterSecret:
      name: cluster-secrets
      namespace: default
      key: SECRET_DOMAIN

deployments:
  - path: .
