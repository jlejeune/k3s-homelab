---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seerr-config-pvc
  namespace: media-automation
spec:
  storageClassName: longhorn
  volumeName: pvc-a774b734-a6a1-462c-9df6-03e672729dfd
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: media-automation
  labels:
    app.kubernetes.io/instance: seerr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: seerr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: seerr
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: seerr
          image: ghcr.io/seerr-team/seerr:v3.4.0
          securityContext:
            runAsUser: 1000
          ports:
            - containerPort: 5055
              name: http
          env:
            - name: TZ
              value: {{TZ}}
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: 5055
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: 5055
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: seerr-config-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: seerr
  namespace: media-automation
spec:
  ports:
    - port: 5055
      name: http
  selector:
    app.kubernetes.io/instance: seerr
