---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shelfmark-config-pvc
  namespace: media-automation
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plundrio-shelfmark
  namespace: media-automation
  labels:
    app.kubernetes.io/instance: plundrio-shelfmark
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: plundrio-shelfmark
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: plundrio-shelfmark
    spec:
      securityContext:
        runAsUser: 1026
        runAsGroup: 100
        fsGroup: 100
      containers:
        - name: plundrio
          image: ghcr.io/elsbrock/plundrio:latest
          ports:
            - containerPort: 9091
              name: http
          env:
            - name: PLDR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: media-automation-secrets
                  key: PUTIO_TOKEN
            - name: PLDR_TARGET
              value: /downloads
            - name: PLDR_FOLDER
              value: "shelfmark"
            - name: TZ
              value: {{TZ}}
          readinessProbe:
            tcpSocket:
              port: 9091
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: 9091
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: downloads
              mountPath: /downloads
      volumes:
        - name: downloads
          nfs:
            server: {{NAS_ADDRESS}}
            path: /volume1/book/downloads/shelfmark
---
apiVersion: v1
kind: Service
metadata:
  name: plundrio-shelfmark
  namespace: media-automation
spec:
  ports:
    - port: 9091
      name: http
  selector:
    app.kubernetes.io/instance: plundrio-shelfmark
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shelfmark
  namespace: media-automation
  labels:
    app.kubernetes.io/instance: shelfmark
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: shelfmark
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: shelfmark
    spec:
      securityContext:
        fsGroup: 100
      containers:
        - name: shelfmark
          image: ghcr.io/calibrain/shelfmark:v1.3.3
          ports:
            - containerPort: 8084
              name: http
          env:
            - name: PUID
              value: "1026"
            - name: PGID
              value: "100"
            - name: TZ
              value: {{TZ}}
            - name: INGEST_DIR
              value: /ingest
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: books
              mountPath: /books
            - name: ingest
              mountPath: /ingest
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: shelfmark-config-pvc
        - name: books
          nfs:
            server: {{NAS_ADDRESS}}
            path: /volume1/book/downloads/shelfmark
        - name: ingest
          nfs:
            server: {{NAS_ADDRESS}}
            path: /volume1/book/ingest
---
apiVersion: v1
kind: Service
metadata:
  name: shelfmark
  namespace: media-automation
spec:
  ports:
    - port: 8084
      name: http
  selector:
    app.kubernetes.io/instance: shelfmark
