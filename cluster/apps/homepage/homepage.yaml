---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/instance: homepage
  annotations:
    reloader.stakater.com/match: "true"
data:
  settings.yaml: |
    title: Jlejeune Homelab
    language: fr
    theme: dark
    color: slate
    headerStyle: clean
    layout:
      Media & Entertainment:
        style: row
        columns: 4
      Media Automation:
        style: row
        columns: 3
      Home Automation:
        style: row
        columns: 4
      AI:
        style: row
        columns: 2
      Kubernetes:
        style: row
        columns: 2
      Monitoring:
        style: row
        columns: 3
      Networking:
        style: row
        columns: 1
      Tools:
        style: row
        columns: 2
      Administration:
        style: row
        columns: 2

  widgets.yaml: |
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
          hour12: false

  bookmarks.yaml: |
    []

  docker.yaml: |
    {}

  kubernetes.yaml: |
    {}

  proxmox.yaml: ""

  custom.css: ""

  custom.js: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/instance: homepage
  annotations:
    reloader.stakater.com/search: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: homepage
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: homepage
    spec:
      restartPolicy: Always
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v1.13.1
          imagePullPolicy: IfNotPresent
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: homepage.jlejeune.eu
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: homepage-config
              mountPath: /app/config
            - name: homepage-logs
              mountPath: /app/config/logs
      volumes:
        - name: homepage-config
          projected:
            sources:
              - configMap:
                  name: homepage
              - secret:
                  name: homepage
        - name: homepage-logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
spec:
  selector:
    app.kubernetes.io/instance: homepage
  ports:
    - name: http
      port: 3000
      targetPort: http
