---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nextcloud-postgres
  namespace: nextcloud
  labels:
    app.kubernetes.io/instance: nextcloud-postgres
  annotations:
    reloader.stakater.com/search: "true"
spec:
  serviceName: nextcloud-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: nextcloud-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: nextcloud-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16.13
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_USER
              value: nextcloud
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - nextcloud
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nextcloud-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-postgres
  namespace: nextcloud
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: nextcloud-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
