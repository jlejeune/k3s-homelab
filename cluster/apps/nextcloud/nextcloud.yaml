---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: nextcloud
  labels:
    app.kubernetes.io/instance: nextcloud
  annotations:
    reloader.stakater.com/search: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: nextcloud
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: nextcloud
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              preference:
                matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
      initContainers:
        - name: wait-for-postgres
          image: postgres:16.14
          command:
            - sh
            - -c
            - |
              until pg_isready -h nextcloud-postgres -U nextcloud; do
                echo "waiting for postgres..."
                sleep 2
              done
      containers:
        - name: nextcloud
          image: nextcloud:34.0.0-apache
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              apt-get update -qq && apt-get install -y -qq smbclient
              exec /entrypoint.sh apache2-foreground
          env:
            - name: POSTGRES_HOST
              value: nextcloud-postgres
            - name: POSTGRES_DB
              value: nextcloud
            - name: POSTGRES_USER
              value: nextcloud
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: POSTGRES_PASSWORD
            - name: NEXTCLOUD_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: NEXTCLOUD_ADMIN_USER
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: NEXTCLOUD_ADMIN_PASSWORD
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: "nextcloud.{{SECRET_DOMAIN}}"
            - name: NEXTCLOUD_DATA_DIR
              value: /var/www/html/data
            - name: OVERWRITEPROTOCOL
              value: https
            - name: OVERWRITECLIURL
              value: "https://nextcloud.{{SECRET_DOMAIN}}"
            - name: TRUSTED_PROXIES
              value: "10.0.0.0/8 192.168.1.0/24"
            - name: APACHE_DISABLE_REWRITE_IP
              value: "1"
            - name: REDIS_HOST
              value: nextcloud-redis
            - name: REDIS_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-secrets
                  key: REDIS_PASSWORD
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - curl
                - -sf
                - -H
                - "Host: nextcloud.{{SECRET_DOMAIN}}"
                - http://localhost/status.php
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            exec:
              command:
                - curl
                - -sf
                - -H
                - "Host: nextcloud.{{SECRET_DOMAIN}}"
                - http://localhost/status.php
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              memory: 512Mi
              cpu: 200m
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/www/html
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nextcloud-data
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: nextcloud
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-cron
  namespace: nextcloud
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/instance: nextcloud
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: nextcloud-cron
              image: nextcloud:34.0.0-apache
              command:
                - su
                - -s
                - /bin/bash
                - www-data
                - -c
                - php -f /var/www/html/cron.php
              resources:
                requests:
                  memory: 128Mi
                  cpu: 50m
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: data
                  mountPath: /var/www/html
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: nextcloud-data
