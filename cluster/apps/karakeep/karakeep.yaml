---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: karakeep-pvc
  namespace: karakeep
spec:
  storageClassName: longhorn
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: karakeep
  namespace: karakeep
  annotations:
    reloader.stakater.com/match: "true"
data:
  NEXTAUTH_URL: "https://bookmarks.{{SECRET_DOMAIN}}"
  DATA_DIR: /data
  OAUTH_WELLKNOWN_URL: "https://auth.{{SECRET_DOMAIN}}/.well-known/openid-configuration"
  OAUTH_CLIENT_ID: karakeep
  OAUTH_PROVIDER_NAME: Authelia
  OLLAMA_BASE_URL: "http://ollama.home-automation.svc.cluster.local:11434"
  INFERENCE_PROVIDER: ollama
  INFERENCE_TEXT_MODEL: llama3.2:1b
  INFERENCE_IMAGE_MODEL: llama3.2:1b
  MEILI_ADDR: "http://meilisearch:7700"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep
  namespace: karakeep
  labels:
    app.kubernetes.io/instance: karakeep
  annotations:
    reloader.stakater.com/search: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: karakeep
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: karakeep
    spec:
      restartPolicy: Always
      enableServiceLinks: false
      containers:
        - name: karakeep
          image: ghcr.io/karakeep-app/karakeep:0.32.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: karakeep
            - secretRef:
                name: karakeep
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - mountPath: /data
              name: karakeep-vol
      volumes:
        - name: karakeep-vol
          persistentVolumeClaim:
            claimName: karakeep-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: karakeep
  namespace: karakeep
spec:
  ports:
    - name: http
      port: 3000
      targetPort: http
  selector:
    app.kubernetes.io/instance: karakeep
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meilisearch-pvc
  namespace: karakeep
spec:
  storageClassName: longhorn
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meilisearch
  namespace: karakeep
  labels:
    app.kubernetes.io/instance: meilisearch
  annotations:
    reloader.stakater.com/search: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: meilisearch
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: meilisearch
    spec:
      restartPolicy: Always
      enableServiceLinks: false
      containers:
        - name: meilisearch
          image: getmeili/meilisearch:v1.43.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7700
              protocol: TCP
          env:
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: karakeep
                  key: MEILI_MASTER_KEY
            - name: MEILI_ENV
              value: production
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - mountPath: /meili_data
              name: meilisearch-vol
      volumes:
        - name: meilisearch-vol
          persistentVolumeClaim:
            claimName: meilisearch-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: meilisearch
  namespace: karakeep
spec:
  ports:
    - name: http
      port: 7700
      targetPort: http
  selector:
    app.kubernetes.io/instance: meilisearch
