---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: karakeep-pvc
  namespace: karakeep
spec:
  storageClassName: longhorn
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: karakeep
  namespace: karakeep
  annotations:
    reloader.stakater.com/match: "true"
data:
  NEXTAUTH_URL: "https://bookmarks.{{SECRET_DOMAIN}}"
  DATA_DIR: /data
  OAUTH_WELLKNOWN_URL: "https://auth.{{SECRET_DOMAIN}}/.well-known/openid-configuration"
  OAUTH_CLIENT_ID: karakeep
  OAUTH_PROVIDER_NAME: Authelia
  OLLAMA_BASE_URL: "http://ollama.home-automation.svc.cluster.local:11434"
  INFERENCE_PROVIDER: ollama
  INFERENCE_TEXT_MODEL: qwen2.5:3b
  INFERENCE_IMAGE_MODEL: qwen2.5:3b
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep
  namespace: karakeep
  labels:
    app.kubernetes.io/instance: karakeep
  annotations:
    reloader.stakater.com/search: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: karakeep
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: karakeep
    spec:
      restartPolicy: Always
      enableServiceLinks: false
      containers:
        - name: karakeep
          image: ghcr.io/karakeep-app/karakeep:0.32.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: karakeep
            - secretRef:
                name: karakeep
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - mountPath: /data
              name: karakeep-vol
      volumes:
        - name: karakeep-vol
          persistentVolumeClaim:
            claimName: karakeep-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: karakeep
  namespace: karakeep
spec:
  ports:
    - name: http
      port: 3000
      targetPort: http
  selector:
    app.kubernetes.io/instance: karakeep
