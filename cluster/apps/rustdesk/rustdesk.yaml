---
# Fronted by Traefik (not a dedicated LoadBalancer) for automatic DNS via
# external-dns. Traefik masks the real client source IP, so hbbs can't do
# NAT-type detection or hole-punching: every session relays through hbbr
# instead of going P2P. Accepted tradeoff for this homelab's usage.
apiVersion: v1
kind: Service
metadata:
  name: rustdesk
  namespace: rustdesk
spec:
  ports:
    - name: nat-test-tcp
      port: 21115
      targetPort: 21115
      protocol: TCP
    - name: id-server-tcp
      port: 21116
      targetPort: 21116
      protocol: TCP
    - name: id-server-udp
      port: 21116
      targetPort: 21116
      protocol: UDP
    - name: relay-tcp
      port: 21117
      targetPort: 21117
      protocol: TCP
  selector:
    app.kubernetes.io/instance: rustdesk
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: rustdesk-nat
  namespace: rustdesk
  annotations:
    external-dns.alpha.kubernetes.io/hostname: rustdesk.{{SECRET_DOMAIN}}
    external-dns.alpha.kubernetes.io/target: {{SECRET_DYNAMIC_DOMAIN}}
spec:
  entryPoints:
    - rustdesk-nat
  routes:
    - match: HostSNI(`*`)
      services:
        - name: rustdesk
          port: 21115
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: rustdesk-id
  namespace: rustdesk
spec:
  entryPoints:
    - rustdesk-id
  routes:
    - match: HostSNI(`*`)
      services:
        - name: rustdesk
          port: 21116
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: rustdesk-relay
  namespace: rustdesk
spec:
  entryPoints:
    - rustdesk-relay
  routes:
    - match: HostSNI(`*`)
      services:
        - name: rustdesk
          port: 21117
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteUDP
metadata:
  name: rustdesk-id-udp
  namespace: rustdesk
spec:
  entryPoints:
    - rustdesk-id-udp
  routes:
    - services:
        - name: rustdesk
          port: 21116
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustdesk-pvc
  namespace: rustdesk
spec:
  storageClassName: longhorn
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustdesk
  namespace: rustdesk
  labels:
    app.kubernetes.io/instance: rustdesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: rustdesk
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: rustdesk
    spec:
      containers:
        - name: hbbs
          image: rustdesk/rustdesk-server:1.1.16
          command: ["hbbs", "-r", "rustdesk.{{SECRET_DOMAIN}}:21117", "-k", "_"]
          ports:
            - containerPort: 21115
              protocol: TCP
            - containerPort: 21116
              protocol: TCP
            - containerPort: 21116
              protocol: UDP
          readinessProbe:
            tcpSocket:
              port: 21116
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 21116
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          volumeMounts:
            - name: data
              mountPath: /root
        - name: hbbr
          image: rustdesk/rustdesk-server:1.1.16
          command: ["hbbr", "-k", "_"]
          ports:
            - containerPort: 21117
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 21117
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 21117
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          volumeMounts:
            - name: data
              mountPath: /root
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustdesk-pvc
