---
# k3s uses containerd, so the pod logs use the CRI format
container_runtime: containerd

agent:
  acquisition:
    - namespace: networking
      podName: traefik-*
      program: traefik
  env:
    - name: COLLECTIONS
      value: crowdsecurity/traefik
  # Traefik prefers the amd64 nodes, and the Raspberry Pis have 4 GB
  nodeSelector:
    kubernetes.io/arch: amd64
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

lapi:
  env:
    # Registers the bouncer of the Traefik plugin with a key from cluster-secrets
    - name: BOUNCER_KEY_traefik
      value: "{{SECRET_CROWDSEC_BOUNCER_KEY}}"
  resources:
    requests:
      cpu: 50m
      memory: 200Mi
    limits:
      cpu: 500m
      memory: 500Mi
