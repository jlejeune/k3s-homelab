---
vars:
  - clusterSecret:
      name: cluster-secrets
      namespace: default
      key: SECRET_DOMAIN
      targetPath: SECRET_DOMAIN
  - clusterSecret:
      name: cluster-secrets
      namespace: default
      key: DISCORD_WEBHOOK_URL
      targetPath: DISCORD_WEBHOOK_URL

deployments:
  - path: victoria-metrics
  - path: vmagent
  - path: alertmanager
  - path: vmalert
  - path: node-exporter
  - path: kube-state-metrics
  - path: grafana
  - path: uptime-kuma
