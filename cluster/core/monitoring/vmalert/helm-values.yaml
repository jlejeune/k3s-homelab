---
server:
  datasource:
    url: "http://victoria-metrics-single-server.monitoring.svc.cluster.local:8428"
  notifiers:
    - url: "http://alertmanager.monitoring.svc.cluster.local:9093"
  evaluationInterval: 60s

  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  config:
    alerts:
      groups:
        - name: node.rules
          rules:
            - alert: NodeCPUHigh
              expr: >
                100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: {% raw %}"CPU élevé sur {{ $labels.instance }}"{% endraw %}
                description: {% raw %}"Utilisation CPU: {{ $value | humanize }}% depuis 15 minutes."{% endraw %}

            - alert: NodeMemoryHigh
              expr: >
                (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: {% raw %}"RAM élevée sur {{ $labels.instance }}"{% endraw %}
                description: {% raw %}"Utilisation mémoire: {{ $value | humanize }}% depuis 10 minutes."{% endraw %}

            - alert: NodeDiskFillingUp
              expr: >
                (node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs", mountpoint!~"/var/lib/kubelet/.*|/run/credentials/.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs", mountpoint!~"/var/lib/kubelet/.*|/run/credentials/.*"}) * 100 < 20
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: {% raw %}"Espace disque bas sur {{ $labels.instance }}"{% endraw %}
                description: {% raw %}"Il reste {{ $value | humanize }}% d'espace libre sur {{ $labels.mountpoint }} depuis 30 minutes. Vérifier les images containerd inutilisées (crictl rmi --prune) et les replicas Longhorn."{% endraw %}

            - alert: NodeDiskLow
              expr: >
                (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 < 10
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: {% raw %}"Disque presque plein sur {{ $labels.instance }}"{% endraw %}
                description: {% raw %}"Espace disque restant: {{ $value | humanize }}% sur {{ $labels.mountpoint }}."{% endraw %}

            - alert: NodeDown
              expr: up{job="node-exporter"} == 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: {% raw %}"Nœud {{ $labels.instance }} injoignable"{% endraw %}
                description: {% raw %}"node-exporter sur {{ $labels.instance }} ne répond plus depuis 5 minutes."{% endraw %}

            - alert: NodeFilesystemReadOnly
              expr: >
                node_filesystem_readonly{fstype!~"tmpfs|ramfs|overlay|squashfs", mountpoint!~"/run/credentials/.*"} == 1
              for: 1m
              labels:
                severity: critical
              annotations:
                summary: {% raw %}"Filesystem en lecture seule sur {{ $labels.instance }}"{% endraw %}
                description: {% raw %}"{{ $labels.mountpoint }} est monté en read-only sur {{ $labels.instance }}."{% endraw %}

        - name: kubernetes.rules
          rules:
            - alert: KubePodCrashLooping
              expr: >
                kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: {% raw %}"Pod {{ $labels.namespace }}/{{ $labels.pod }} en CrashLoopBackOff"{% endraw %}
                description: {% raw %}"Le container {{ $labels.container }} redémarre en boucle depuis 5 minutes."{% endraw %}

            - alert: KubePodNotReady
              expr: >
                kube_pod_status_phase{phase=~"Pending|Unknown"} == 1
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: {% raw %}"Pod {{ $labels.namespace }}/{{ $labels.pod }} non prêt"{% endraw %}
                description: {% raw %}"Pod en phase {{ $labels.phase }} depuis 15 minutes."{% endraw %}

            - alert: KubePodStuckCreating
              expr: >
                kube_pod_container_status_waiting_reason{reason=~"ContainerCreating|PodInitializing"} == 1
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: {% raw %}"Pod {{ $labels.namespace }}/{{ $labels.pod }} bloqué au démarrage"{% endraw %}
                description: {% raw %}"Le container {{ $labels.container }} est en {{ $labels.reason }} depuis 15 minutes."{% endraw %}

            - alert: KubeContainerOOMKilled
              expr: >
                kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
              for: 0m
              labels:
                severity: warning
              annotations:
                summary: {% raw %}"Container OOM killed: {{ $labels.namespace }}/{{ $labels.pod }}"{% endraw %}
                description: {% raw %}"Le container {{ $labels.container }} a été tué par OOM."{% endraw %}

            - alert: KubeDeploymentUnavailable
              expr: >
                kube_deployment_status_replicas_unavailable > 0
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: {% raw %}"Deployment {{ $labels.namespace }}/{{ $labels.deployment }} dégradé"{% endraw %}
                description: {% raw %}"{{ $value }} replica(s) indisponible(s) depuis 15 minutes."{% endraw %}

        - name: control-plane.rules
          rules:
            - alert: KubeAPIServerDown
              expr: >
                up{job="kubernetes-apiservers"} == 0
              for: 3m
              labels:
                severity: critical
              annotations:
                summary: {% raw %}"API server injoignable ({{ $labels.instance }})"{% endraw %}
                description: {% raw %}"Le scrape de l'API server échoue depuis 3 minutes."{% endraw %}

            - alert: KubeAPIServerLatencyHigh
              expr: >
                histogram_quantile(0.99, sum by (le, verb) (rate(apiserver_request_duration_seconds_bucket{job="kubernetes-apiservers", verb!~"LIST|WATCH|CONNECT"}[5m])))
                > 1
                and
                sum by (verb) (rate(apiserver_request_duration_seconds_count{job="kubernetes-apiservers", verb!~"LIST|WATCH|CONNECT"}[5m])) > 0.1
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: {% raw %}"Latence élevée de l'API server ({{ $labels.verb }})"{% endraw %}
                description: {% raw %}"Le p99 des requêtes {{ $labels.verb }} est de {{ $value | humanizeDuration }} depuis 10 minutes."{% endraw %}

            - alert: KubeAPIServerListLatencyHigh
              expr: >
                histogram_quantile(0.99, sum by (le) (rate(apiserver_request_duration_seconds_bucket{job="kubernetes-apiservers", verb="LIST"}[5m]))) > 5
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: {% raw %}"Latence élevée des LIST de l'API server"{% endraw %}
                description: {% raw %}"Le p99 des requêtes LIST est de {{ $value | humanizeDuration }} depuis 10 minutes."{% endraw %}

            - alert: KubeAPIServerErrors
              expr: >
                sum(rate(apiserver_request_total{job="kubernetes-apiservers", code=~"5.."}[5m]))
                / sum(rate(apiserver_request_total{job="kubernetes-apiservers"}[5m])) * 100 > 5
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: {% raw %}"Erreurs 5xx sur l'API server"{% endraw %}
                description: {% raw %}"{{ $value | humanize }}% des requêtes de l'API server échouent en 5xx depuis 10 minutes."{% endraw %}

            - alert: KubeEtcdRequestsSlow
              expr: >
                histogram_quantile(0.99, sum by (le, operation) (rate(etcd_request_duration_seconds_bucket{job="kubernetes-apiservers"}[5m]))) > 0.5
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: {% raw %}"etcd lent vu depuis l'API server ({{ $labels.operation }})"{% endraw %}
                description: {% raw %}"Le p99 des opérations etcd {{ $labels.operation }} est de {{ $value | humanizeDuration }} depuis 10 minutes."{% endraw %}

        - name: longhorn.rules
          rules:
            - alert: LonghornVolumeRobustnessDegraded
              expr: >
                longhorn_volume_robustness{state="degraded"} == 1
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: {% raw %}"Volume Longhorn dégradé: {{ $labels.volume }}"{% endraw %}
                description: {% raw %}"Le volume {{ $labels.volume }} est dégradé (replica manquante) depuis 5 minutes."{% endraw %}

            - alert: LonghornVolumeRobustnessFaulted
              expr: >
                longhorn_volume_robustness{state="faulted"} == 1
              for: 0m
              labels:
                severity: critical
              annotations:
                summary: {% raw %}"Volume Longhorn en erreur: {{ $labels.volume }}"{% endraw %}
                description: {% raw %}"Le volume {{ $labels.volume }} est faulted — données inaccessibles."{% endraw %}

            - alert: LonghornNodeNotReady
              expr: >
                longhorn_node_status{condition="ready"} == 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: {% raw %}"Nœud Longhorn {{ $labels.node }} non prêt"{% endraw %}
                description: {% raw %}"Le nœud {{ $labels.node }} est indisponible dans Longhorn depuis 5 minutes."{% endraw %}
