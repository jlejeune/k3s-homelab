---
remoteWrite:
  - url: http://victoria-metrics-single-server.monitoring.svc.cluster.local:8428/api/v1/write
    urlRelabelConfig:
      # K3s also serves the control-plane metrics on the server node's kubelet
      # endpoint: keep only the copy scraped from the apiserver itself
      - source_labels: [job, __name__]
        regex: "kubernetes-nodes;(apiserver|etcd)_.*"
        action: drop
      # Redundant with apiserver_request_duration_seconds_bucket
      - source_labels: [__name__]
        regex: apiserver_request_sli_duration_seconds_bucket
        action: drop

rbac:
  create: true
  pspEnabled: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

extraVolumes:
  - name: home-assistant-prometheus
    secret:
      secretName: home-assistant-prometheus

extraVolumeMounts:
  - name: home-assistant-prometheus
    mountPath: /etc/secrets/home-assistant
    readOnly: true

extraScrapeConfigs:
  - job_name: home-assistant
    bearer_token_file: /etc/secrets/home-assistant/TOKEN
    static_configs:
      - targets:
          - home-assistant.home-automation.svc.cluster.local
    metrics_path: /api/prometheus
  - job_name: node-exporter
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - monitoring
    relabel_configs:
      - source_labels: [__meta_kubernetes_endpoints_name]
        regex: node-exporter
        action: keep
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: nodename
      - source_labels: [nodename]
        target_label: instance
        regex: "([^:]+)(:[0-9]+)?"
        replacement: "${1}"
  - job_name: traefik
    static_configs:
      - targets:
          - traefik.networking.svc.cluster.local:9100
    metrics_path: /metrics
  - job_name: kube-state-metrics
    static_configs:
      - targets:
          - kube-state-metrics.monitoring.svc.cluster.local:8080
    metrics_path: /metrics
  - job_name: longhorn
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - storage
    relabel_configs:
      - source_labels: [__meta_kubernetes_endpoints_name]
        regex: longhorn-backend
        action: keep
      - source_labels: [__address__]
        regex: ".+:9500"
        action: keep
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: nodename
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: longhorn_rest_client_.*
        action: drop
    metrics_path: /metrics
    scrape_timeout: 30s
    max_scrape_size: 100MiB
  - job_name: victoria-metrics
    static_configs:
      - targets:
          - victoria-metrics-single-server.monitoring.svc.cluster.local:8428
    metrics_path: /metrics
