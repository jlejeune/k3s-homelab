---
admin:
  existingSecret: grafana
  userKey: admin_user
  passwordKey: admin_password
deploymentStrategy:
  type: Recreate
persistence:
  enabled: true
  storageClassName: longhorn
  size: 1Gi
  accessModes:
    - ReadWriteOnce
env:
  GF_EXPLORE_ENABLED: true
  GF_DISABLE_SANITIZE_HTML: true
  GF_PANELS_DISABLE_SANITIZE_HTML: true
  GF_LOG_FILTERS: rendering:debug
ingress:
  enabled: false
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 80
        preference:
          matchExpressions:
            - key: kubernetes.io/arch
              operator: In
              values:
                - amd64
plugins:
  - natel-discrete-panel
  - pr0ps-trackmap-panel
  - grafana-piechart-panel
  - grafana-clock-panel
  - vonage-status-panel
  - grafana-worldmap-panel
serviceMonitor:
  enabled: false
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/default
dashboards:
  default:
    node-exporter:
      gnetId: 1860
      revision: 37
      datasource: Prometheus
    traefik:
      gnetId: 17346
      revision: 9
      datasource: Prometheus
    longhorn:
      gnetId: 13032
      revision: 6
      datasource: Prometheus
    victoria-metrics:
      gnetId: 10229
      revision: 22
      datasource: Prometheus
sidecar:
  datasources:
    enabled: true
    searchNamespace: ALL
  dashboards:
    enabled: true
    searchNamespace: ALL
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://victoria-metrics-single-server.monitoring.svc.cluster.local:8428
        isDefault: true
        editable: true
grafana.ini:
  server:
    root_url: "https://grafana.{{SECRET_DOMAIN}}"
  paths:
    data: /var/lib/grafana/data
    logs: /var/log/grafana
    plugins: /var/lib/grafana/plugins
    provisioning: /etc/grafana/provisioning
  analytics:
    check_for_updates: false
  log:
    mode: console
  grafana_net:
    url: https://grafana.net
  auth.basic:
    disable_login_form: false
  users:
    allow_sign_up: false
