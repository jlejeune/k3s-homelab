---
fullnameOverride: node-exporter

tolerations:
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

hostNetwork: true
hostPID: true

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

service:
  port: 9100
  targetPort: 9100
