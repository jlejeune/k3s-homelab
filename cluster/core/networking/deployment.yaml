---
vars:
  - targetPath: LB_TRAEFIK_ADDRESS
    clusterConfigMap:
      name: cluster-settings
      namespace: default
      key: LB_TRAEFIK_ADDRESS
  - targetPath: VIP_INTERFACE
    clusterConfigMap:
      name: cluster-settings
      namespace: default
      key: VIP_INTERFACE
  - targetPath: K3S_MASTER_VIP
    clusterConfigMap:
      name: cluster-settings
      namespace: default
      key: K3S_MASTER_VIP
  - targetPath: SECRET_DOMAIN
    clusterSecret:
      name: cluster-secrets
      namespace: default
      key: SECRET_DOMAIN

deployments:
  - path: traefik
  - path: kube-vip
  - path: external-dns
  - include: metallb
