---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/rancher/system-upgrade-controller/v0.21.1/pkg/crds/yaml/generated/upgrade.cattle.io_plans.yaml
  - https://github.com/rancher/system-upgrade-controller?ref=v0.21.1
images:
  - name: rancher/system-upgrade-controller
    newTag: v0.21.1
labels:
  - pairs:
      app.kubernetes.io/name: system-upgrade-controller
      app.kubernetes.io/instance: system-upgrade-controller
patches:
  - patch: |
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: system-upgrade
    target:
      kind: Namespace
      name: system-upgrade
