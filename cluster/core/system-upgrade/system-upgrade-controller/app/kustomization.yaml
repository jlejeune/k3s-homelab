---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/rancher/system-upgrade-controller/releases/download/v0.19.2/crd.yaml
  - https://github.com/rancher/system-upgrade-controller?ref=v0.20.1
images:
  - name: rancher/system-upgrade-controller
    newTag: v0.20.1
labels:
  - pairs:
      app.kubernetes.io/name: system-upgrade-controller
      app.kubernetes.io/instance: system-upgrade-controller
patches:
  - patch: |
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: system-upgrade
    target:
      kind: Namespace
      name: system-upgrade
