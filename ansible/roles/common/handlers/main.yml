---
- name: restart systemd-journald
  service:
    name: systemd-journald
    state: restarted
  become: true

- name: systemd-networkd
  service:
    name: systemd-networkd
    state: restarted

- name: restart sshd
  service:
    name: ssh
    state: restarted

- name: reconfigure locales
  command: dpkg-reconfigure -f noninteractive locales

- name: reboot
  ansible.builtin.reboot:
    msg: "Ansible reboot triggered"
    reboot_timeout: 300
  become: true
