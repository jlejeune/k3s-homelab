---
- name: Create users accounts
  ansible.builtin.user:
    name: "{{ item.username }}"
    comment: "{{ item.comment }}"
    shell: /bin/zsh
    password: "{{ ansible_become_pass | password_hash('sha512') }}"
    append: yes
    group: "{{ item.group }}"
    groups: "{{ item.groups }}"
    uid: "{{ item.uid }}"
    update_password: on_create
  with_items: "{{ users }}"

- name: Get latest chezmoi version
  ansible.builtin.uri:
    url: https://api.github.com/repos/twpayne/chezmoi/releases/latest
    return_content: true
  register: chezmoi_release
  delegate_to: localhost

- name: Install chezmoi from .tar.gz
  vars:
    chezmoi_version: "{{ chezmoi_release.json.tag_name | regex_replace('^v', '') }}"
    chezmoi_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
  ansible.builtin.unarchive:
    src: "https://github.com/twpayne/chezmoi/releases/download/v{{ chezmoi_version }}/chezmoi_{{ chezmoi_version }}_linux_{{ chezmoi_arch }}.tar.gz"
    dest: /usr/local/bin
    remote_src: false
    extra_opts:
      - chezmoi
    creates: /usr/local/bin/chezmoi

- name: Create chezmoi config directory
  ansible.builtin.file:
    path: /home/jlejeune/.config/chezmoi
    state: directory
    owner: jlejeune
    group: users
    mode: '0755'

- name: Create chezmoi config
  ansible.builtin.copy:
    dest: /home/jlejeune/.config/chezmoi/chezmoi.toml
    owner: jlejeune
    group: users
    mode: '0600'
    content: |
      encryption = "age"
      [age]
          identity = "~/.config/chezmoi/key.txt"
          recipient = "age1tcree7luqazqy6fyzujszu85pky4dm7ncygfds3x6pxr4qmpd3qshrjd5n"

      [data]
          is_server = true
          name = "{{ chezmoi_name }}"
          email = "{{ chezmoi_email }}"
          email_github = "{{ chezmoi_email_github }}"

- name: Deploy chezmoi Age key
  ansible.builtin.copy:
    dest: /home/jlejeune/.config/chezmoi/key.txt
    owner: jlejeune
    group: users
    mode: '0600'
    content: "{{ chezmoi_age_key }}"

- name: Install fzf
  ansible.builtin.git:
    repo: https://github.com/junegunn/fzf.git
    dest: /home/jlejeune/.fzf
    depth: 1
    update: no
  become: yes
  become_user: jlejeune

- name: Run fzf install script
  ansible.builtin.command:
    cmd: /home/jlejeune/.fzf/install --all --no-update-rc
    creates: /home/jlejeune/.fzf/bin/fzf
  become: yes
  become_user: jlejeune
  environment:
    HOME: /home/jlejeune

- name: Symlink fzf to /usr/local/bin
  ansible.builtin.file:
    src: /home/jlejeune/.fzf/bin/fzf
    dest: /usr/local/bin/fzf
    state: link

- name: Install oh-my-zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: /home/jlejeune/.oh-my-zsh
    depth: 1
    update: no
  become: yes
  become_user: jlejeune

- name: Init and apply chezmoi dotfiles
  ansible.builtin.command:
    cmd: "chezmoi init --apply https://oauth2:{{ github_token }}@github.com/jlejeune/dotfiles.git"
    creates: /home/jlejeune/.local/share/chezmoi
  become: yes
  become_user: jlejeune
  environment:
    HOME: /home/jlejeune

- name: Update and apply chezmoi dotfiles
  ansible.builtin.command:
    cmd: "chezmoi update{{ ' --force' if chezmoi_force | default(false) | bool else '' }}"
  become: yes
  become_user: jlejeune
  environment:
    HOME: /home/jlejeune

- name: Remove the user 'pi'
  ansible.builtin.user:
    name: pi
    state: absent
    remove: yes
