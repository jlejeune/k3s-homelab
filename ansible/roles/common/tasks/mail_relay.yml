---
- name: Configure postfix as a relay-only null client
  lineinfile:
    dest: /etc/postfix/main.cf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  with_items:
    - regexp: "^relayhost\\s*="
      line: "relayhost = [{{ mail_relay_host }}]:{{ mail_relay_port }}"
    - regexp: "^myorigin\\s*="
      line: "myorigin = {{ inventory_hostname }}.{{ mail_domain }}"
    - regexp: "^inet_interfaces\\s*="
      line: "inet_interfaces = loopback-only"
    - regexp: "^mydestination\\s*="
      line: "mydestination = $myhostname, localhost.$mydomain, localhost"
  notify:
    - restart postfix
