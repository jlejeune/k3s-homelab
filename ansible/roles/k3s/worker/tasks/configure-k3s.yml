---
- name: Copy K3s service file
  template:
    src: "k3s.service.j2"
    dest: "{{ systemd_dir }}/k3s-node.service"
    owner: root
    group: root
    mode: 0755

- name: Stop and disable legacy k3s.service if present
  systemd:
    name: k3s
    state: stopped
    enabled: false
  failed_when: false

- name: Remove legacy k3s.service if present
  file:
    path: "{{ systemd_dir }}/k3s.service"
    state: absent

- name: Enable and check K3s service
  systemd:
    name: k3s-node
    daemon_reload: yes
    state: restarted
    enabled: yes

- name: Wait for K3s agent kubeconfig files to be created
  wait_for:
    path: "{{ item }}"
    timeout: 60
  loop:
    - /var/lib/rancher/k3s/agent/kubeproxy.kubeconfig
    - /var/lib/rancher/k3s/agent/kubelet.kubeconfig

- name: Restrict kubeconfig file permissions (CIS 4.1.3 + 4.1.5)
  file:
    path: "{{ item }}"
    mode: "0600"
  loop:
    - /var/lib/rancher/k3s/agent/kubeproxy.kubeconfig
    - /var/lib/rancher/k3s/agent/kubelet.kubeconfig
