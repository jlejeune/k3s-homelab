---
- name: Set k9s architecture
  set_fact:
    k9s_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

- name: Delete k9s if already present
  ansible.builtin.file:
    path: /usr/local/bin/k9s
    state: absent

- name: Download k9s archive
  ansible.builtin.get_url:
    url: "https://github.com/derailed/k9s/releases/download/{{ k9s_version }}/k9s_Linux_{{ k9s_arch }}.tar.gz"
    dest: /tmp

- name: Extract k9s archive
  ansible.builtin.unarchive:
    src: "/tmp/k9s_Linux_{{ k9s_arch }}.tar.gz"
    dest: /tmp
    remote_src: yes

- name: Move k9s binary to /usr/local/bin/ folder
  ansible.builtin.command: mv /tmp/k9s /usr/local/bin/k9s

- name: Change k9s ownership, group and mode
  ansible.builtin.file:
    path: /usr/local/bin/k9s
    owner: root
    group: root
    mode: 0755
